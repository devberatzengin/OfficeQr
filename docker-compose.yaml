version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: officeqr-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: office_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - officeqr-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ========================================
  # BACKEND - OfficeQr API
  # ========================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: officeqr-api
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=office_db;Username=postgres;Password=postgres"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - officeqr-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  officeqr-network:
    driver: bridge